# Production overrides — apply with:
#   helm upgrade --install swingtrader ./helm/swingtrader -f helm/swingtrader/values-prod.yaml \
#     --set coreService.secrets.JWT_SECRET=<real-secret> \
#     --set apiGateway.config.JWT_SECRET=<real-secret> \
#     --set coreService.secrets.UPSTOX_CLIENT_ID=<real-id> \
#     --set coreService.secrets.UPSTOX_CLIENT_SECRET=<real-secret>
#
# Or use --values with a secrets override file that is NOT committed to git.

global:
  environment: prod

apiGateway:
  replicas: 2
  image:
    tag: 1.0.0
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m

coreService:
  replicas: 2
  image:
    tag: 1.0.0
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m

insightsService:
  replicas: 2
  image:
    tag: 1.0.0
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m

backtestService:
  replicas: 1
  image:
    tag: 1.0.0
  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 2Gi
      cpu: 2000m

frontend:
  replicas: 3
  image:
    tag: 1.0.0
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 200m

ingress:
  host: asset.yourdomain.com
  tls:
    enabled: true
    secretName: platform-tls
    certManagerIssuer: letsencrypt-prod
