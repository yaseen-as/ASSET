apiVersion: v1
kind: Service
metadata:
  name: react-frontend-service
  labels:
    app: react-frontend
spec:
  selector:
    app: react-frontend
  ports:
    - port: 80
      # In dev, Vite listens on 5173; in prod, nginx listens on 80.
      targetPort: {{ if .Values.hotReload.enabled }}5173{{ else }}{{ .Values.frontend.port }}{{ end }}
