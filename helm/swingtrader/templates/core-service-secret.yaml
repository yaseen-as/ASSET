apiVersion: v1
kind: Secret
metadata:
  name: core-service-secret
type: Opaque
# stringData accepts plain text — Kubernetes base64-encodes automatically on apply.
# IMPORTANT: Override secrets via --set or a separate out-of-repo values file before deploying to production.
stringData:
{{- range $key, $value := .Values.coreService.secrets }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
