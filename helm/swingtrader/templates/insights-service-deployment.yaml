apiVersion: apps/v1
kind: Deployment
metadata:
  name: insights-service
  labels:
    app: insights-service
    app.kubernetes.io/component: backend
    environment: {{ .Values.global.environment }}
spec:
  replicas: {{ .Values.insightsService.replicas }}
  selector:
    matchLabels:
      app: insights-service
  template:
    metadata:
      labels:
        app: insights-service
        app.kubernetes.io/component: backend
    spec:
      initContainers:
        {{- include "swingtrader.waitForPostgres" . | nindent 8 }}
      containers:
        - name: app
          {{- if .Values.hotReload.enabled }}
          image: {{ .Values.hotReload.nodeImage }}
          command: ["sh", "-c"]
          args:
            - "rm -f /app/packages/shared/tsconfig.tsbuildinfo && (cd /app && npm run build --workspace=packages/shared) && npm run dev"
          {{- else }}
          image: {{ .Values.insightsService.image.repository }}:{{ .Values.insightsService.image.tag }}
          {{- end }}
          workingDir: {{ .Values.insightsService.workingDir }}
          ports:
            - containerPort: {{ .Values.insightsService.port }}
              name: http
          envFrom:
            - configMapRef:
                name: insights-service-config
          {{- if .Values.hotReload.enabled }}
          env:
            - name: NODE_ENV
              value: development
          volumeMounts:
            {{- include "swingtrader.hotReloadVolumeMount" . | nindent 12 }}
          {{- end }}
          {{- if .Values.insightsService.probes.enabled }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.insightsService.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.insightsService.port }}
            initialDelaySeconds: 30
            periodSeconds: 15
          {{- end }}
          {{- with .Values.insightsService.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- if .Values.hotReload.enabled }}
      volumes:
        {{- include "swingtrader.hotReloadVolume" . | nindent 8 }}
      {{- end }}
