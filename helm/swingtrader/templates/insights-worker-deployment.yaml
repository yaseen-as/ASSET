{{- if .Values.insightsWorker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: insights-worker
  labels:
    app: insights-worker
    app.kubernetes.io/component: backend
    environment: {{ .Values.global.environment }}
spec:
  replicas: {{ .Values.insightsWorker.replicas }}
  selector:
    matchLabels:
      app: insights-worker
  template:
    metadata:
      labels:
        app: insights-worker
        app.kubernetes.io/component: backend
    spec:
      initContainers:
        {{- include "swingtrader.waitForPostgres" . | nindent 8 }}
      containers:
        - name: app
          {{- if .Values.hotReload.enabled }}
          image: {{ .Values.hotReload.nodeImage }}
          command: ["sh", "-c"]
          args:
            - "rm -f /app/packages/shared/tsconfig.tsbuildinfo && (cd /app && npm run build --workspace=packages/shared) && npm run dev:worker --workspace=services/insights-service"
          {{- else }}
          image: {{ .Values.insightsService.image.repository }}:{{ .Values.insightsService.image.tag }}
          command: ["node", "dist/worker.js"]
          {{- end }}
          workingDir: {{ .Values.insightsService.workingDir }}
          envFrom:
            - configMapRef:
                name: insights-service-config
          {{- if .Values.hotReload.enabled }}
          env:
            - name: NODE_ENV
              value: development
          volumeMounts:
            {{- include "swingtrader.hotReloadVolumeMount" . | nindent 12 }}
          {{- end }}
          {{- with .Values.insightsWorker.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- if .Values.hotReload.enabled }}
      volumes:
        {{- include "swingtrader.hotReloadVolume" . | nindent 8 }}
      {{- end }}
{{- end }}
