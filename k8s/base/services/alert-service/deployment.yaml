apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-service
  labels:
    app: alert-service
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: alert-service
  template:
    metadata:
      labels:
        app: alert-service
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: app
          image: yaseenas/alert-service:latest
          ports:
            - containerPort: 3007
          workingDir: /app/services/alert-service
          envFrom:
            - configMapRef:
                name: alert-service-config
          readinessProbe:
            httpGet:
              path: /health
              port: 3007
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3007
            initialDelaySeconds: 30
            periodSeconds: 15
