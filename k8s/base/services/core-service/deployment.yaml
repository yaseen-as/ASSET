apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-service
  labels:
    app: core-service
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: core-service
  template:
    metadata:
      labels:
        app: core-service
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: app
          image: yaseenas/core-service:latest
          ports:
            - containerPort: 3001
              name: http
          workingDir: /app/services/core-service
          envFrom:
            - configMapRef:
                name: core-service-config
            - secretRef:
                name: core-service-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 15
