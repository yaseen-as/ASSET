apiVersion: v1
kind: Secret
metadata:
  name: core-service-secret
type: Opaque
# stringData accepts plain text — Kubernetes base64-encodes it automatically on apply.
# IMPORTANT: Replace all CHANGE_ME values before deploying.
# Never commit real credentials to git. Use Sealed Secrets, Vault, or
# a separate out-of-repo secret file (kubectl apply -f secret.local.yaml) instead.
stringData:
  # 32-byte hex key for AES-256 encryption of broker access/refresh tokens.
  # Generate: openssl rand -hex 32
  BROKER_TOKEN_ENCRYPTION_KEY: "3fc8eb37f3ddc5bf48505f73eba5d64bec06b446ac4839f8f2b282478e3ee911"

  # Upstox OAuth app credentials — from Upstox developer portal
  UPSTOX_CLIENT_ID: "688f6c33-d7c7-4c52-89e8-1e990dd6c767"
  UPSTOX_CLIENT_SECRET: "53sgr84l0u"

  # PostgreSQL password (moved from configmap)
  DB_PASSWORD: "admin123"

  # JWT signing secret — must match api-gateway JWT_SECRET
  JWT_SECRET: "dev-jwt-secret-change-this-in-production-min-32chars"