apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
data:
  SERVICE_NAME: api-gateway
  PORT: "3000"
  NODE_ENV: production
  # Upstream service URLs (internal cluster DNS)
  AUTH_SERVICE_URL: http://auth-service
  USER_SERVICE_URL: http://user-service
  BROKER_SERVICE_URL: http://broker-service
  MARKET_DATA_SERVICE_URL: http://market-data-service
  PORTFOLIO_SERVICE_URL: http://portfolio-service
  RECOMMENDATION_SERVICE_URL: http://recommendation-service
  ALERT_SERVICE_URL: http://alert-service
  NOTIFICATION_SERVICE_URL: http://notification-service
  REDIS_URL: redis://redis-service:6379
