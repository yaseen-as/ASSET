apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
data:
  SERVICE_NAME: api-gateway
  PORT: "3000"
  NODE_ENV: production
  # Upstream service URLs (internal cluster DNS)
  TRADING_SERVICE_URL: http://trading-service
  MARKET_SERVICE_URL: http://market-service
  REDIS_URL: redis://redis-service:6379
  # Must match trading-service JWT_SECRET (auth merged into trading-service)
  JWT_SECRET: dev-jwt-secret-change-this-in-production-min-32chars
