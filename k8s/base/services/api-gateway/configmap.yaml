apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
data:
  SERVICE_NAME: api-gateway
  PORT: "3000"
  NODE_ENV: production
  # Upstream service URLs (internal cluster DNS)
  AUTH_SERVICE_URL: http://auth-service
  TRADING_SERVICE_URL: http://trading-service
  MARKET_DATA_SERVICE_URL: http://market-data-service
  RECOMMENDATION_SERVICE_URL: http://recommendation-service
  ENGAGEMENT_SERVICE_URL: http://engagement-service
  REDIS_URL: redis://redis-service:6379
  # Must match auth-service JWT_SECRET
  JWT_SECRET: dev-jwt-secret-change-this-in-production-min-32chars
