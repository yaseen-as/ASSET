apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - api-gateway/
  - auth-service/
  - trading-service/
  - market-data-service/
  - recommendation-service/
  - engagement-service/

# Wait for postgres before starting any backend service
patches:
  - path: wait-for-postgres.yaml
    target:
      kind: Deployment
      labelSelector: "app.kubernetes.io/component=backend"
