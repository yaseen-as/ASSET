apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-service
  labels:
    app: portfolio-service
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: portfolio-service
  template:
    metadata:
      labels:
        app: portfolio-service
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: app
          image: yaseenas/portfolio-service:latest
          ports:
            - containerPort: 3005
          workingDir: /app/services/portfolio-service
          envFrom:
            - configMapRef:
                name: portfolio-service-config
          readinessProbe:
            httpGet:
              path: /health
              port: 3005
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3005
            initialDelaySeconds: 30
            periodSeconds: 15
